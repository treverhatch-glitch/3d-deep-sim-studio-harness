name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Syntax, every required gate (incl. the self-test that proves each gate can fail),
      # the closed-loop failure proof, read-only gates, and the changelog entry.
      - name: npm run release
        run: node scripts/release.mjs
      - name: Optional gates (report only)
        if: always()
        run: node scripts/run-gates.mjs --only balance,fun,renderer-budget,reviewer
