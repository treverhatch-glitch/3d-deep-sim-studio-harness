name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24'] # the two supported LTS lines
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Syntax, every required gate (incl. the self-test that proves each gate can fail),
      # the closed-loop failure proof, read-only gates, and the changelog entry.
      - name: npm run release
        run: node scripts/release.mjs
      - name: Optional gates (report only)
        if: always()
        run: node scripts/run-gates.mjs --only balance,fun,renderer-budget,hud

  # The stress test runs on Windows: prove every required gate passes there too (no bash, python via py/python).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: npm run verify (required gates)
        run: node scripts/run-gates.mjs --required-only

  # Drives the War Room in Chromium: all three views, desktop and phone, every button.
  war-room-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: npm run hud:check
        run: node qa/hud-check.mjs
      # Plays the example game in Chromium with real key presses and checks the screen matches the sim.
      - name: npm run play:browser
        run: node qa/browser-play.mjs

  war-room-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Builds the War Room with its pinned deps and type-checks the React components.
      - name: npm run hub:build
        run: npm run hub:build
