name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 2.47.0: with the repository variable HARNESS_RUNNER set to self-hosted (Settings > Secrets and variables >
# Actions > Variables), every GitHub-hosted job below is skipped and the self-hosted job at the end runs the
# checks on the owner's own Windows PC instead: free for a private repo. Only ever for a PRIVATE repo: on a public
# one, anyone's pull request could run code on that PC. docs/SELF-HOSTED-RUNNER.md.
jobs:
  release-gate:
    if: vars.HARNESS_RUNNER != 'self-hosted'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24'] # the two supported LTS lines
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the protected-files check compares the PR with its base branch
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # 2.32.0: protected files (studio/protected.json) change only with the owner's signed approval. The check
      # that judges a PR is the BASE branch's copy, run against the PR's checkout, so a PR can't weaken it.
      - name: Protected files need the owner's approval
        if: github.event_name == 'pull_request'
        env:
          STUDIO_PROTECT_BASE: origin/${{ github.base_ref }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "origin/${{ github.base_ref }}"
          if [ -f "$RUNNER_TEMP/base/qa/protected-check.mjs" ]; then
            STUDIO_PROTECT_ROOT="$GITHUB_WORKSPACE" node "$RUNNER_TEMP/base/qa/protected-check.mjs"
          else
            node qa/protected-check.mjs
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci --no-audit --no-fund # typescript: map find and the size check parse with it
      # Syntax, every required gate, the closed-loop failure proof, read-only gates, and the changelog entry.
      # 2.72.0 (d): the self-test (the gate that proves each gate can fail) runs in the parallel shards below.
      - name: npm run release (the self-test runs in release-gate-selftest)
        run: node scripts/release.mjs --except selftest
      # 2.84: no command that awaits an import which imports it back (exit 13, unsettled top-level await).
      - name: No top-level await that closes an import cycle
        run: node scripts/check-top-level-await.mjs
      - name: Optional gates (report only)
        if: always()
        run: node scripts/run-gates.mjs --only balance,fun,renderer-budget

  # 2.72.0 (d): the self-test in 4 parallel shards per Node version (`--shard i/4` runs every 4th unit of
  # qa/selftest.mjs in file order; units that must stay together share a group). `node qa/selftest.mjs --list-shards 4`
  # shows the split. The name starts with release-gate, so a check pattern for release-gate covers the shards too.
  release-gate-selftest:
    if: vars.HARNESS_RUNNER != 'self-hosted'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the self-test reads the template's folders from the merge base
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci --no-audit --no-fund
      - name: Self-test shard ${{ matrix.shard }}/4
        run: node qa/selftest.mjs --shard ${{ matrix.shard }}/4 --timing

  # The engine track's Godot template, with a real Godot: its port matches the web game seed by seed,
  # and its headless gate passes.
  engine-godot:
    if: vars.HARNESS_RUNNER != 'self-hosted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Download Godot 4.5.1 (headless use)
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "STUDIO_GODOT=$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Godot template parity and gate
        run: node scripts/check-engine-template.mjs

  # 2.46.0: the Unity template's sim with plain .NET (no editor, no licence): purity, its tests, parity with the web game.
  engine-unity-sim:
    if: vars.HARNESS_RUNNER != 'self-hosted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Unity template sim, purity and parity
        run: node scripts/check-unity-template.mjs

  # 2.46.0: the Unity editor's own run (Edit Mode and Play Mode, the controls test) on the template. It needs a
  # Unity licence: add the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD secrets (docs/UNITY-TRACK.md). Until
  # then it says so and passes.
  # 2.84: pinned to v4.3.2. The floating v4 tag moved to a rewrite (v4.4.0) whose licence-file activation fails for a
  # Personal licence ("Code 400 ... TimeStamp validation failed": this repository's first real run, 2026-11-11);
  # v4.3.2 is the older activation path.
  engine-unity-editor:
    if: vars.HARNESS_RUNNER != 'self-hosted'
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: No Unity licence yet
        if: env.UNITY_LICENSE == ''
        run: echo "::notice::No UNITY_LICENSE secret, so the Unity editor tests were skipped (docs/UNITY-TRACK.md)"
      - uses: actions/checkout@v7
        if: env.UNITY_LICENSE != ''
      - uses: game-ci/unity-test-runner@v4.3.2
        if: env.UNITY_LICENSE != ''
        with:
          projectPath: engine/_unity
          testMode: all

  # 2.84: the harness's own Unity readers against a real editor's output (scripts/unity-real.mjs): the Edit Mode
  # arguments the harness plans, a failing test's name, a compile error's file. Three small copies of the template,
  # one editor run each. Needs the licence secrets; a pull request from a fork gets none, says so and passes.
  engine-unity-real:
    if: vars.HARNESS_RUNNER != 'self-hosted'
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: No Unity licence here
        if: env.UNITY_LICENSE == ''
        run: echo "::notice::No UNITY_LICENSE secret (none is set, or this is a pull request from a fork), so the real-editor checks were skipped (docs/UNITY-TRACK.md)"
      - uses: actions/checkout@v7
        if: env.UNITY_LICENSE != ''
      - uses: actions/setup-node@v7
        if: env.UNITY_LICENSE != ''
        with:
          node-version: '24'
      - name: Three copies of the template, each with a test assembly .NET does not compile
        id: prep
        if: env.UNITY_LICENSE != ''
        run: node scripts/unity-real.mjs prepare
      - name: "plan: Edit Mode with the harness's own arguments"
        uses: game-ci/unity-test-runner@v4.3.2
        if: env.UNITY_LICENSE != ''
        continue-on-error: true
        with:
          projectPath: .unity-real/plan
          testMode: editmode
          artifactsPath: .unity-real/out/plan
          customParameters: ${{ steps.prep.outputs.plan_args }}
      - name: "red: one test fails on purpose"
        uses: game-ci/unity-test-runner@v4.3.2
        if: env.UNITY_LICENSE != ''
        continue-on-error: true
        with:
          projectPath: .unity-real/red
          testMode: editmode
          artifactsPath: .unity-real/out/red
      - name: "broken: one file does not compile"
        uses: game-ci/unity-test-runner@v4.3.2
        if: env.UNITY_LICENSE != ''
        continue-on-error: true
        with:
          projectPath: .unity-real/broken
          testMode: editmode
          artifactsPath: .unity-real/out/broken
      - name: The harness's readers against what the editor wrote
        if: env.UNITY_LICENSE != ''
        run: node scripts/unity-real.mjs check
      - uses: actions/upload-artifact@v4
        if: always() && env.UNITY_LICENSE != ''
        with:
          name: unity-real
          path: .unity-real/out
          if-no-files-found: warn

  # 2.46.0: a playable build of the Unity template on every change to main, as a downloadable artifact.
  # 2.48.0: a Windows .exe (the Unity track's default), built on Linux with GameCI. Needs the licence secrets.
  engine-unity-build:
    if: github.event_name == 'push' && vars.HARNESS_RUNNER != 'self-hosted'
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: No Unity licence yet
        if: env.UNITY_LICENSE == ''
        run: echo "::notice::No UNITY_LICENSE secret, so no Unity build was made (docs/UNITY-TRACK.md)"
      - uses: actions/checkout@v7
        if: env.UNITY_LICENSE != ''
      - uses: game-ci/unity-builder@v4
        if: env.UNITY_LICENSE != ''
        with:
          projectPath: engine/_unity
          targetPlatform: StandaloneWindows64
          buildMethod: StudioBuild.Windows
          customParameters: -out Build/Windows
      - uses: actions/upload-artifact@v4
        if: env.UNITY_LICENSE != ''
        with:
          name: unity-windows
          path: engine/_unity/Build/Windows
          if-no-files-found: warn

  # The stress test runs on Windows: prove every required gate passes there too (no bash, python via py/python).
  windows:
    if: vars.HARNESS_RUNNER != 'self-hosted'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci --no-audit --no-fund
      # 2.72.0 (d): the self-test (most of this job's ~45 min) runs in windows-selftest's shards.
      - name: npm run verify (required gates; the self-test runs in windows-selftest)
        run: node scripts/run-gates.mjs --required-only --deep --except selftest

  # 2.72.0 (d): the self-test on Windows in 4 parallel shards.
  windows-selftest:
    if: vars.HARNESS_RUNNER != 'self-hosted'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci --no-audit --no-fund
      - name: Self-test shard ${{ matrix.shard }}/4
        run: node qa/selftest.mjs --shard ${{ matrix.shard }}/4

  # 2.72.0 (d): one result for the release gate: red when the release checks or any self-test shard failed (or was
  # cancelled or skipped), on Linux or Windows.
  release-gate-summary:
    if: always() && vars.HARNESS_RUNNER != 'self-hosted'
    needs: [release-gate, release-gate-selftest, windows, windows-selftest]
    runs-on: ubuntu-latest
    steps:
      - name: Every release-gate job and self-test shard passed
        env:
          RESULTS: ${{ needs.release-gate.result }} ${{ needs.release-gate-selftest.result }} ${{ needs.windows.result }} ${{ needs.windows-selftest.result }}
        run: |
          echo "release-gate, release-gate-selftest, windows, windows-selftest: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "::error::a release-gate job or self-test shard did not pass ($RESULTS)"; exit 1; fi
          done

  # 2.80: the game's checks in Chromium (the War Room browser check, which this job was named for, is gone).
  browser-checks:
    if: vars.HARNESS_RUNNER != 'self-hosted'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Plays the example game in Chromium with real key presses and checks the screen matches the sim.
      - name: npm run play:browser
        run: node qa/browser-play.mjs
      # 2.39.0: a dead Buy button with a gamed test passes without the Game Bible's effect and fails with it.
      - name: Game Bible control effects (planted dead button)
        run: node scripts/check-control-effects.mjs
      # 2.45.0: a web game that isn't a cartridge, driven by its studio.browser.json: live controls pass, dead ones fail.
      - name: Real-input controls for a studio web game (npm run play:controls)
        run: node scripts/check-controls-play.mjs
      # 2.56.0 (PU-15): effect stills at fixed times; clean effects pass, six planted faults are named.
      - name: Visual-effect checks (npm run vfx)
        run: node scripts/check-vfx.mjs

  # 2.47.0: the checks on the owner's PC (a self-hosted Windows runner), when HARNESS_RUNNER is self-hosted.
  # One job, in order: protected files, every required gate and the release checks, the game's controls in
  # Chromium, the Unity template on .NET. Node 24, Python, .NET 8 and Git must be installed on the PC.
  self-hosted:
    if: vars.HARNESS_RUNNER == 'self-hosted'
    runs-on: [self-hosted, Windows]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Protected files need the owner's approval
        if: github.event_name == 'pull_request'
        env:
          STUDIO_PROTECT_BASE: origin/${{ github.base_ref }}
          STUDIO_PROTECT_ROOT: ${{ github.workspace }}
        run: |
          git worktree remove --force "${{ runner.temp }}/base" 2>$null
          git worktree add --detach "${{ runner.temp }}/base" "origin/${{ github.base_ref }}"
          node "${{ runner.temp }}/base/qa/protected-check.mjs"
      - run: npm ci --no-audit --no-fund
      - name: npm run release (every required gate, the self-test, the release checks)
        run: node scripts/release.mjs
      - name: Controls in Chromium
        run: |
          npx playwright install chromium
          node qa/browser-play.mjs
          node scripts/check-control-effects.mjs
          node scripts/check-controls-play.mjs
          node scripts/check-vfx.mjs
      - name: Unity template on .NET (skips without the .NET 8 SDK)
        run: node scripts/check-unity-template.mjs

