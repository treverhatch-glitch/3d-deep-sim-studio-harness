name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check harness/models.config.mjs
          node --check harness/route.mjs
          node --check harness/event.mjs
          node --check harness/task.mjs
          node --check hub/server.mjs
          node --check qa/playtest.mjs
          node --check cartridges/example-sim/index.mjs
      - name: Session files
        run: node scripts/verify-session.mjs
      - name: Sim purity
        run: node scripts/check-sim-purity.mjs
      - name: Sim isolation
        run: bash scripts/check-sim-isolation.sh
      - name: Golden hashes
        run: node qa/check-golden.mjs
      - name: Approvals
        run: node scripts/check-approvals.mjs
      - name: Regressions
        run: node qa/check-regressions.mjs
      - name: Renderer budget
        run: node scripts/check-renderer-budget.mjs
      - name: Reviewer markers
        run: node scripts/check-reviewer.mjs
      - name: Closed-loop must fail when simulated
        run: |
          set +e
          node harness/closed-loop.mjs --simulate-fail
          code=$?
          set -e
          test "$code" -eq 1
      - name: Secret scan
        run: bash scripts/secret-scan.sh
