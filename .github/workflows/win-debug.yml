name: win-debug (temporary, never merged)
on:
  push:
    branches: [claude/297-windbg]
jobs:
  u293b:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: install
        run: npm ci
      - name: units 290b then 293b, twice
        shell: bash
        run: |
          for i in 1 2; do
            node qa/selftest.mjs --only 290b,293b > out$i.log 2>&1 || true
            echo "run $i: pass $(grep -c '\[selftest\] PASS' out$i.log) fail $(grep -c '\[selftest\] FAIL' out$i.log)"
            grep -E "\[selftest\] FAIL" out$i.log | cut -c1-200
            grep -E "\[dbg\]" out$i.log | cut -c1-6000
          done
          exit 0
