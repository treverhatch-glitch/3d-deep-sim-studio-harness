name: nightly-soak

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node qa/soak.mjs --seeds 8 --ticks 200
