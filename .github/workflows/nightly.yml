name: nightly-soak

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Every game cartridge: many seeds, long replays and every scenario, twice each.
      - run: node qa/soak.mjs --seeds 32 --ticks 2000
      - run: node scripts/balance-sweep.mjs
