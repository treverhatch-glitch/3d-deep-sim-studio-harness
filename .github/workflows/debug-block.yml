name: debug-block
on:
  push:
    branches: [claude/dbg-264fix]
permissions:
  contents: read
jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: node qa/debug-block.mjs
