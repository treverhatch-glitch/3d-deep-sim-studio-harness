<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Example sim</title>
<style>
  html, body { margin: 0; background: #0f1a14; color: #e8f2e8; font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  canvas { display: block; width: 100%; aspect-ratio: 2 / 1; background: #173023; border-radius: 6px; }
  .hud { display: flex; flex-wrap: wrap; gap: 16px; margin: 10px 0; }
  .hud b { font-variant-numeric: tabular-nums; }
  button { font: inherit; padding: 6px 14px; }
  #end { min-height: 1.4em; font-weight: 600; }
</style>
</head>
<body>
<main>
  <canvas id="world" width="720" height="360" aria-label="The world: units drive right, crates stay put"></canvas>
  <div class="hud" role="status">
    <span>Credits <b id="hud-credits">0</b></span>
    <span>Power <b id="hud-energy">0</b></span>
    <span>Units <b id="hud-units">0</b></span>
    <span>Next unit <b id="hud-cost">0</b></span>
  </div>
  <button id="buy" type="button">Buy a unit (B)</button>
  <p id="end"></p>
</main>
<script type="module" src="./main.mjs"></script>
</body>
</html>
