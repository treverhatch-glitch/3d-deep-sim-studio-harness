<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hatchfield Mission Control</title>
  <style>
    body { background: #0a0a0f; color: #e0e0e0; font-family: system-ui, sans-serif; margin: 0; padding: 20px; }
    h1 { color: #00d4ff; }
    .event { background: #1a1a2e; border-left: 4px solid #00d4ff; padding: 12px; margin: 8px 0; border-radius: 4px; }
    .status { font-weight: bold; color: #00ff88; }
    .worker { color: #ffaa00; }
    #log { max-height: 80vh; overflow-y: auto; }
  </style>
</head>
<body>
  <h1>Hatchfield AI Studio — Mission Control</h1>
  <p>Passive HUB. Reads <code>/tmp/agent-events.jsonl</code>. Zero LLM tokens.</p>
  <div id="log">Waiting for events...</div>

  <script>
    // For local use: run a simple server or open via file:// and poll a served endpoint.
    // This example assumes a small local server is serving the JSONL (see README).
    async function poll() {
      try {
        const res = await fetch('/events');
        const text = await res.text();
        const lines = text.trim().split('\n').filter(Boolean);
        const log = document.getElementById('log');
        log.innerHTML = lines.slice(-50).reverse().map(line => {
          const e = JSON.parse(line);
          return `<div class="event"><span class="status">${e.status}</span> · <span class="worker">${e.worker}</span><br><small>${e.ts} · ${e.agent} · ${e.file || ''} ${e.bugId || ''}</small></div>`;
        }).join('');
      } catch (err) {
        document.getElementById('log').innerHTML = '<div class="event">No events yet or server not running. Start with: <code>node hub/server.js</code></div>';
      }
    }
    setInterval(poll, 2000);
    poll();
  </script>
</body>
</html>
